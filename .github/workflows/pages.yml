name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate application
        run: |
          python -m py_compile servidor.py
          python -m json.tool public/manifest.webmanifest > /dev/null
          for file in public/*.js; do node --check "$file"; done
      - name: Prepare static site
        run: |
          mkdir dist
          cp -R public/. dist/
          python -c "from pathlib import Path; p = Path('dist/config.js'); text = p.read_text(); assert 'localOnly: false' in text; p.write_text(text.replace('localOnly: false', 'localOnly: true'))"
          test -s dist/index.html
          grep -q 'localOnly: true' dist/config.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
